spring.application.name=elzarape
server.port=8080

# BD por defecto: H2 en memoria (desarrollo). Para MySQL usa el perfil "mysql".
spring.datasource.url=jdbc:h2:mem:elzarape;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# JWT (cambia el secreto en producción con la variable JWT_SECRET; mínimo 32 caracteres)
zarape.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
zarape.jwt.expiration-minutes=480

# CORS: origen(es) del front separados por coma
zarape.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Usuario admin inicial (solo se crea si no existe)
zarape.seed.enabled=true
zarape.seed.admin-username=${ADMIN_USER:admin}
zarape.seed.admin-password=${ADMIN_PASSWORD:admin123}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
